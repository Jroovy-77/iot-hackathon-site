; FloodLink — เฟิร์มแวร์รอบ Breadboard (ESP32-C3 Super Mini + SX1276 915 MHz)
; โปรแกรม: house = กล่องบ้าน · receiver = ตัวรับ (ต่อโน้ตบุ๊ก) · ping / pong = ทดสอบวิทยุ B2
; ขาทั้งหมดอยู่ที่ common/pins.h ที่เดียว · ค่าวิทยุอยู่ที่ common/radio_config.h ที่เดียว
; common/ = ตรรกะที่ไม่ผูกกับบอร์ด (เทสต์บนคอมได้) · board/ = ส่วนที่ใช้ฮาร์ดแวร์ (วิทยุ เสียง)
;
; คอมไพล์:   pio run -e house -e receiver
; อัปโหลด:   pio run -e receiver -t upload   แล้ว   pio device monitor
; เทสต์บนคอม: pio test -e native

[platformio]
src_dir = .
default_envs = house, receiver

[esp32c3]
platform = platformio/espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
framework = arduino
monitor_speed = 115200
build_flags =
  -I common
  -I board
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  jgromes/RadioLib @ 7.8.1

[env:house]
extends = esp32c3
build_src_filter = -<*> +<common/> +<board/> +<house/>
lib_deps =
  ${esp32c3.lib_deps}
  adafruit/Adafruit NeoPixel @ 1.15.5

[env:receiver]
extends = esp32c3
build_src_filter = -<*> +<common/> +<board/> +<receiver/>

; B2: บอร์ด A อัป ping (ส่ง PING #n) · บอร์ด B อัป pong (ตอบ ACK #n)
[env:ping]
extends = esp32c3
build_src_filter = -<*> +<common/> +<board/> +<pingpong/>
build_flags = ${esp32c3.build_flags} -D PINGPONG_ROLE_PING=1

[env:pong]
extends = esp32c3
build_src_filter = -<*> +<common/> +<board/> +<pingpong/>
build_flags = ${esp32c3.build_flags} -D PINGPONG_ROLE_PING=0

; เทสต์ตรรกะบนคอมพิวเตอร์ (ไม่ต้องมีบอร์ด) — ใช้โค้ดใน common/ ตัวเดียวกับบอร์ด
[env:native]
platform = platformio/windows_x86 @ 1.2.0
build_src_filter = -<*> +<common/>
test_build_src = yes
build_flags = -I common -std=gnu++11 -Wall

; ตัวรับจำลองบนคอม (โค้ด common/gateway ตัวเดียวกับบอร์ด) ใช้ทดสอบแดชบอร์ด A3
[env:receiver_host]
platform = platformio/windows_x86 @ 1.2.0
build_src_filter = -<*> +<common/> +<host/>
build_flags = -I common -std=gnu++11 -Wall
